services:
  pr-reviewer:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Bind mount: copy this folder to another machine to move data
      - ./data:/app/backend/data
    environment:
      - PYTHONUNBUFFERED=1
      # Required when the app is reachable from the internet. Protects settings, repos, and webhook creation.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    restart: unless-stopped
